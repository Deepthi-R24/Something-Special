<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Until We Meet Again ❤️</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #020817;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
}


/* =====================================================
   ANIMATED BACKGROUND
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255, 71, 151, 0.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(161, 75, 255, 0.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 105, 180, 0.04),
            transparent 45%
        );

    pointer-events: none;
    z-index: -5;
}


/* =====================================================
   FLOATING GLOW
===================================================== */

.glow-one,
.glow-two,
.glow-three {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(80px);
    opacity: 0.12;
    z-index: -4;
}

.glow-one {
    width: 250px;
    height: 250px;
    background: #ff4f98;
    top: -100px;
    left: -80px;
    animation: glowMoveOne 12s ease-in-out infinite alternate;
}

.glow-two {
    width: 300px;
    height: 300px;
    background: #9b5cff;
    right: -120px;
    bottom: -100px;
    animation: glowMoveTwo 15s ease-in-out infinite alternate;
}

.glow-three {
    width: 180px;
    height: 180px;
    background: #ff76b5;
    left: 45%;
    top: 40%;
    animation: glowMoveThree 10s ease-in-out infinite alternate;
}

@keyframes glowMoveOne {

    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(100px, 80px);
    }

}

@keyframes glowMoveTwo {

    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(-100px, -80px);
    }

}

@keyframes glowMoveThree {

    from {
        transform: scale(0.7);
        opacity: 0.08;
    }

    to {
        transform: scale(1.3);
        opacity: 0.16;
    }

}


/* =====================================================
   FLOATING HEARTS
===================================================== */

.heart {
    position: fixed;
    bottom: -40px;

    color: rgba(255, 105, 180, 0.35);

    font-size: 18px;

    pointer-events: none;

    z-index: -2;

    animation: floatUp linear infinite;
}

.heart:nth-child(1) {
    left: 8%;
    animation-duration: 10s;
    animation-delay: 1s;
}

.heart:nth-child(2) {
    left: 23%;
    animation-duration: 13s;
    animation-delay: 4s;
}

.heart:nth-child(3) {
    left: 47%;
    animation-duration: 11s;
    animation-delay: 2s;
}

.heart:nth-child(4) {
    left: 68%;
    animation-duration: 14s;
    animation-delay: 5s;
}

.heart:nth-child(5) {
    left: 88%;
    animation-duration: 12s;
    animation-delay: 3s;
}

@keyframes floatUp {

    0% {
        transform: translateY(0) scale(0.7) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 0.7;
    }

    80% {
        opacity: 0.35;
    }

    100% {
        transform: translateY(-110vh) scale(1.3) rotate(30deg);
        opacity: 0;
    }

}


/* =====================================================
   PAGE FRAME
===================================================== */

#pageFrame {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: none;

    display: block;

    opacity: 1;

    background: transparent;

    transition:
        opacity 0.45s ease,
        transform 0.45s ease;

}


/* =====================================================
   PAGE LOADING EFFECT
===================================================== */

#pageLoader {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #020817;

    z-index: 999998;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.35s ease;

}

#pageLoader.active {

    opacity: 1;

    pointer-events: all;

}

.loader-content {

    text-align: center;

}

.loader-heart {

    font-size: 48px;

    animation: heartbeat 1.2s infinite;

}

.loader-text {

    margin-top: 15px;

    color: #ff76b5;

    font-family: 'Great Vibes', cursive;

    font-size: 30px;

}

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }

}


/* =====================================================
   MUSIC PANEL
===================================================== */

#musicBox {

    position: fixed;

    right: 22px;
    bottom: 22px;

    display: flex;

    align-items: center;

    gap: 10px;

    z-index: 999999;

}


/* =====================================================
   MUSIC STATUS
===================================================== */

#musicStatus {

    padding: 8px 15px;

    border-radius: 20px;

    background: rgba(14, 21, 37, 0.88);

    border: 1px solid rgba(255, 105, 180, 0.25);

    color: #f4dce8;

    font-size: 11px;

    white-space: nowrap;

    opacity: 0;

    transform: translateX(10px);

    transition: all 0.35s ease;

    backdrop-filter: blur(10px);

}

#musicBox:hover #musicStatus {

    opacity: 1;

    transform: translateX(0);

}


/* =====================================================
   MUSIC BUTTON
===================================================== */

#musicToggle {

    width: 56px;
    height: 56px;

    border: 1px solid rgba(255, 126, 184, 0.35);

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            rgba(42, 22, 52, 0.98),
            rgba(18, 20, 39, 0.98)
        );

    color: white;

    font-size: 22px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(255, 105, 180, 0.12);

    transition: all 0.3s ease;

}

#musicToggle:hover {

    transform: scale(1.1);

    border-color: rgba(255, 105, 180, 0.8);

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(255, 105, 180, 0.3);

}

#musicToggle.playing {

    animation: musicPulse 1.8s infinite;

}

@keyframes musicPulse {

    0% {

        box-shadow:
            0 0 0 0 rgba(255, 105, 180, 0.45),
            0 8px 30px rgba(0, 0, 0, 0.35);

    }

    70% {

        box-shadow:
            0 0 0 14px rgba(255, 105, 180, 0),
            0 8px 30px rgba(0, 0, 0, 0.35);

    }

    100% {

        box-shadow:
            0 0 0 0 rgba(255, 105, 180, 0),
            0 8px 30px rgba(0, 0, 0, 0.35);

    }

}


/* =====================================================
   HIDDEN AUDIO
===================================================== */

.hidden-audio {

    display: none;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #musicBox {

        right: 14px;
        bottom: 14px;

    }

    #musicToggle {

        width: 48px;
        height: 48px;

        font-size: 19px;

    }

    #musicStatus {

        display: none;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND EFFECTS
===================================================== -->

<div class="glow-one"></div>
<div class="glow-two"></div>
<div class="glow-three"></div>

<div class="heart">❤️</div>
<div class="heart">💗</div>
<div class="heart">💕</div>
<div class="heart">💖</div>
<div class="heart">❤️</div>


<!-- =====================================================
     BACKGROUND MUSIC
===================================================== -->

<audio
    id="backgroundMusic"
    class="hidden-audio"
    preload="auto">

    <source
        src="assets/music/Ninna-Sanihake.mp3"
        type="audio/mpeg">

</audio>


<!-- =====================================================
     SECOND SONG
===================================================== -->

<audio
    id="secondaryMusic"
    class="hidden-audio"
    preload="auto">

    <source
        src="assets/music/O-Sampigeye-Video-Song-Karpoorada-Gombe-Ramesh-Aravind-Shruthi-Hamsalekha-K-S-Chitra.mp3"
        type="audio/mpeg">

</audio>


<!-- =====================================================
     MUSIC CONTROL
===================================================== -->

<div id="musicBox">

    <div id="musicStatus">
        🎵 Music is playing
    </div>

    <button
        id="musicToggle"
        title="Play / Pause Music"
        aria-label="Play or pause background music">

        🎵

    </button>

</div>


<!-- =====================================================
     PAGE LOADER
===================================================== -->

<div id="pageLoader">

    <div class="loader-content">

        <div class="loader-heart">
            ❤️
        </div>

        <div class="loader-text">
            A beautiful memory is loading...
        </div>

    </div>

</div>


<!-- =====================================================
     WEBSITE
===================================================== -->

<iframe
    id="pageFrame"
    src="home.html"
    title="Until We Meet Again">
</iframe>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const backgroundMusic =
    document.getElementById("backgroundMusic");

const secondaryMusic =
    document.getElementById("secondaryMusic");

const musicToggle =
    document.getElementById("musicToggle");

const musicStatus =
    document.getElementById("musicStatus");

const pageFrame =
    document.getElementById("pageFrame");

const pageLoader =
    document.getElementById("pageLoader");


/* =====================================================
   STATE
===================================================== */

let musicHasStarted = false;

let backgroundWasPlaying = false;

let secondaryWasPlaying = false;


/* =====================================================
   STORAGE
===================================================== */

const MUSIC_TIME_KEY =
    "untilWeMeetAgainMusicTime";

const MUSIC_PLAYING_KEY =
    "untilWeMeetAgainMusicPlaying";


/* =====================================================
   UPDATE MUSIC BUTTON
===================================================== */

function updateMusicButton() {

    if (!musicToggle) return;

    if (!backgroundMusic.paused) {

        musicToggle.classList.add("playing");

        musicToggle.textContent = "🎵";

        musicStatus.textContent =
            "🎵 Music is playing";

    } else {

        musicToggle.classList.remove("playing");

        musicToggle.textContent = "🔇";

        musicStatus.textContent =
            "🔇 Music paused";

    }

}


/* =====================================================
   RESTORE POSITION
===================================================== */

function restoreMusicPosition() {

    const savedTime =
        sessionStorage.getItem(MUSIC_TIME_KEY);

    if (
        savedTime !== null &&
        !isNaN(parseFloat(savedTime))
    ) {

        backgroundMusic.currentTime =
            parseFloat(savedTime);

    }

}


/* =====================================================
   SAVE POSITION
===================================================== */

function saveMusicPosition() {

    if (!backgroundMusic) return;

    sessionStorage.setItem(
        MUSIC_TIME_KEY,
        backgroundMusic.currentTime.toString()
    );

    sessionStorage.setItem(
        MUSIC_PLAYING_KEY,
        backgroundMusic.paused
            ? "false"
            : "true"
    );

}


/* =====================================================
   SAVE EVERY HALF SECOND
===================================================== */

setInterval(function() {

    if (
        backgroundMusic &&
        !backgroundMusic.paused
    ) {

        saveMusicPosition();

    }

}, 500);


/* =====================================================
   AUDIO READY
===================================================== */

backgroundMusic.addEventListener(
    "loadedmetadata",
    function() {

        restoreMusicPosition();

    }
);


/* =====================================================
   START BACKGROUND MUSIC
===================================================== */

function startBackgroundMusic() {

    if (!backgroundMusic) return;

    backgroundMusic
        .play()
        .then(function() {

            musicHasStarted = true;

            saveMusicPosition();

            updateMusicButton();

        })
        .catch(function() {

            updateMusicButton();

        });

}


/* =====================================================
   FIRST USER INTERACTION
===================================================== */

function firstInteraction() {

    if (!musicHasStarted) {

        startBackgroundMusic();

    }

}


/* =====================================================
   USER INTERACTION
===================================================== */

document.addEventListener(
    "click",
    firstInteraction,
    { once: true }
);

document.addEventListener(
    "touchstart",
    firstInteraction,
    { once: true }
);

document.addEventListener(
    "keydown",
    firstInteraction,
    { once: true }
);


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    function() {

        restoreMusicPosition();

        startBackgroundMusic();

    }
);


/* =====================================================
   MUSIC BUTTON
===================================================== */

musicToggle.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        if (secondaryWasPlaying) {

            secondaryMusic.pause();

            secondaryWasPlaying = false;

        }


        if (backgroundMusic.paused) {

            startBackgroundMusic();

        } else {

            backgroundMusic.pause();

            saveMusicPosition();

            updateMusicButton();

        }

    }
);


/* =====================================================
   PAUSE BACKGROUND MUSIC
===================================================== */

function pauseBackgroundMusic() {

    if (!backgroundMusic) return;


    if (!backgroundMusic.paused) {

        backgroundWasPlaying = true;

        saveMusicPosition();

        backgroundMusic.pause();

    } else {

        backgroundWasPlaying = false;

    }


    updateMusicButton();

}


/* =====================================================
   RESUME BACKGROUND MUSIC
===================================================== */

function resumeBackgroundMusic() {

    if (!backgroundMusic) return;


    if (backgroundWasPlaying) {

        backgroundMusic
            .play()
            .then(function() {

                updateMusicButton();

            })
            .catch(function() {});

    }

}


/* =====================================================
   PLAY SECOND SONG
===================================================== */

function playSecondSong() {

    if (!secondaryMusic) return;


    backgroundWasPlaying =
        !backgroundMusic.paused;


    if (backgroundWasPlaying) {

        saveMusicPosition();

    }


    backgroundMusic.pause();


    secondaryMusic.currentTime = 0;


    secondaryMusic
        .play()
        .then(function() {

            secondaryWasPlaying = true;

        })
        .catch(function() {});

}


/* =====================================================
   PAUSE SECOND SONG
===================================================== */

function pauseSecondSong() {

    if (!secondaryMusic) return;


    secondaryMusic.pause();

    secondaryWasPlaying = false;


    if (backgroundWasPlaying) {

        backgroundMusic
            .play()
            .then(function() {

                updateMusicButton();

            })
            .catch(function() {});

    }

}


/* =====================================================
   SECOND SONG FINISHED
===================================================== */

secondaryMusic.addEventListener(
    "ended",
    function() {

        secondaryWasPlaying = false;


        if (backgroundWasPlaying) {

            backgroundMusic
                .play()
                .then(function() {

                    updateMusicButton();

                })
                .catch(function() {});

        }

    }
);


/* =====================================================
   BACKGROUND SONG FINISHED
===================================================== */

backgroundMusic.addEventListener(
    "ended",
    function() {

        backgroundMusic.currentTime = 0;

        backgroundMusic
            .play()
            .then(function() {

                musicHasStarted = true;

                saveMusicPosition();

                updateMusicButton();

            })
            .catch(function() {});

    }
);


/* =====================================================
   SAVE BEFORE LEAVING
===================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        saveMusicPosition();

    }
);


/* =====================================================
   PAGE NAVIGATION
===================================================== */

window.loadPage = function(page) {

    if (!pageFrame) return;


    pageLoader.classList.add("active");

    pageFrame.style.opacity = "0";


    setTimeout(function() {

        pageFrame.src = page;


        pageFrame.onload = function() {

            setTimeout(function() {

                pageFrame.style.opacity = "1";

                pageLoader.classList.remove("active");

            }, 150);

        };

    }, 250);

};


/* =====================================================
   CHILD PAGE MESSAGES
===================================================== */

window.addEventListener(
    "message",
    function(event) {

        if (!event.data) return;


        /* PLAY SECOND SONG */

        if (
            event.data.type ===
            "playSecondSong"
        ) {

            playSecondSong();

        }


        /* PAUSE SECOND SONG */

        if (
            event.data.type ===
            "pauseSecondSong"
        ) {

            pauseSecondSong();

        }


        /* TOGGLE BACKGROUND MUSIC */

        if (
            event.data.type ===
            "toggleBackgroundMusic"
        ) {

            if (backgroundMusic.paused) {

                startBackgroundMusic();

            } else {

                backgroundMusic.pause();

                saveMusicPosition();

                updateMusicButton();

            }

        }


        /* VIDEO STARTED */

        if (
            event.data.type ===
            "videoStarted"
        ) {

            pauseBackgroundMusic();

        }


        /* VIDEO FINISHED */

        if (
            event.data.type ===
            "videoFinished"
        ) {

            resumeBackgroundMusic();

        }

    }
);

</script>

</body>

</html>
