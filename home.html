<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Until We Meet Again ❤️</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

/* =====================================================
   HOME PAGE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #020817;
    overflow: hidden;
}


/* =====================================================
   HERO
===================================================== */

#hero {

    position: relative;

    width: 100%;
    height: 100vh;

    min-height: 600px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255, 80, 160, 0.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(146, 76, 255, 0.16),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #020817,
            #0b1024,
            #12091c
        );

}


/* =====================================================
   GLOWING CIRCLES
===================================================== */

#hero::before {

    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 70, 150, 0.15),
            transparent 70%
        );

    top: -180px;
    left: -150px;

    filter: blur(20px);

    animation: floatingGlow 8s ease-in-out infinite alternate;

}


#hero::after {

    content: "";

    position: absolute;

    width: 450px;
    height: 450px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(156, 80, 255, 0.13),
            transparent 70%
        );

    bottom: -180px;
    right: -150px;

    filter: blur(20px);

    animation: floatingGlowTwo 10s ease-in-out infinite alternate;

}


@keyframes floatingGlow {

    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(80px, 70px) scale(1.2);
    }

}


@keyframes floatingGlowTwo {

    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(-70px, -60px) scale(1.15);
    }

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(2, 8, 23, 0.45),
            rgba(2, 8, 23, 0.15),
            rgba(2, 8, 23, 0.45)
        );

    z-index: 1;

}


/* =====================================================
   FLOATING HEARTS
===================================================== */

.floating-heart {

    position: absolute;

    color: rgba(255, 105, 180, 0.55);

    font-size: 20px;

    z-index: 2;

    pointer-events: none;

    animation: heartFloat linear infinite;

}


.heart1 {
    left: 8%;
    bottom: -30px;
    animation-duration: 9s;
    animation-delay: 1s;
}

.heart2 {
    left: 22%;
    bottom: -30px;
    animation-duration: 12s;
    animation-delay: 4s;
}

.heart3 {
    left: 48%;
    bottom: -30px;
    animation-duration: 10s;
    animation-delay: 2s;
}

.heart4 {
    left: 73%;
    bottom: -30px;
    animation-duration: 13s;
    animation-delay: 5s;
}

.heart5 {
    left: 90%;
    bottom: -30px;
    animation-duration: 11s;
    animation-delay: 3s;
}


@keyframes heartFloat {

    0% {
        transform: translateY(0) scale(0.6) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 0.7;
    }

    80% {
        opacity: 0.4;
    }

    100% {
        transform: translateY(-110vh) scale(1.2) rotate(25deg);
        opacity: 0;
    }

}


/* =====================================================
   HERO CONTENT
===================================================== */

.hero-content {

    position: relative;

    z-index: 5;

    width: min(760px, 90%);

    padding: 55px 45px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(25, 31, 48, 0.82),
            rgba(15, 19, 35, 0.78)
        );

    border:

        1px solid
        rgba(255, 105, 180, 0.22);

    border-radius: 30px;

    box-shadow:

        0 30px 80px
        rgba(0, 0, 0, 0.45),

        0 0 50px
        rgba(255, 75, 155, 0.08);

    backdrop-filter: blur(18px);

}


/* =====================================================
   SMALL TITLE
===================================================== */

.small-title {

    margin-bottom: 20px;

    color: #ff75b6;

    font-size: 14px;

    font-weight: 500;

    letter-spacing: 2px;

    text-transform: uppercase;

}


/* =====================================================
   MAIN TITLE
===================================================== */

.hero-content h1 {

    margin: 0;

    color: white;

    font-family: 'Great Vibes', cursive;

    font-size: clamp(55px, 8vw, 90px);

    font-weight: 400;

    line-height: 1.1;

    text-shadow:

        0 0 15px rgba(255, 105, 180, 0.35),

        0 0 35px rgba(255, 105, 180, 0.15);

}


/* =====================================================
   FRIEND NAME
===================================================== */

.friend-name {

    margin-top: 12px;

    margin-bottom: 25px;

    color: #ff63a9;

    font-family: 'Great Vibes', cursive;

    font-size: clamp(35px, 5vw, 55px);

    font-weight: 400;

    text-shadow:

        0 0 15px
        rgba(255, 80, 160, 0.45);

}


/* =====================================================
   HERO TEXT
===================================================== */

.hero-text {

    max-width: 560px;

    margin:

        0 auto 35px;

    color: rgba(255, 255, 255, 0.82);

    font-size: 16px;

    line-height: 2;

}


/* =====================================================
   BUTTON
===================================================== */

#startJourney {

    position: relative;

    border: none;

    padding:

        15px 32px;

    border-radius: 50px;

    background:

        linear-gradient(
            135deg,
            #ff4f9a,
            #ff72b6
        );

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:

        0 10px 30px
        rgba(255, 79, 154, 0.35);

    transition:

        transform 0.3s ease,
        box-shadow 0.3s ease;

    overflow: hidden;

}


#startJourney::before {

    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.35),
            transparent
        );

    transition: left 0.5s ease;

}


#startJourney:hover::before {

    left: 100%;

}


#startJourney:hover {

    transform:

        translateY(-4px)
        scale(1.03);

    box-shadow:

        0 15px 40px
        rgba(255, 79, 154, 0.50);

}


#startJourney:active {

    transform: scale(0.97);

}


/* =====================================================
   LITTLE DECORATION
===================================================== */

.decorative-line {

    width: 80px;

    height: 2px;

    margin: 25px auto;

    border-radius: 10px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ff63a9,
            transparent
        );

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #hero {

        min-height: 100vh;

        padding: 20px;

    }


    .hero-content {

        padding: 40px 25px;

        border-radius: 24px;

    }


    .hero-content h1 {

        font-size: 55px;

    }


    .friend-name {

        font-size: 40px;

    }


    .hero-text {

        font-size: 14px;

        line-height: 1.9;

    }


    #startJourney {

        padding:

            13px 25px;

        font-size: 14px;

    }

}

</style>

</head>


<body>


<section id="hero">


    <div class="overlay"></div>


    <!-- FLOATING HEARTS -->

    <div class="floating-heart heart1">❤️</div>

    <div class="floating-heart heart2">💗</div>

    <div class="floating-heart heart3">💕</div>

    <div class="floating-heart heart4">💖</div>

    <div class="floating-heart heart5">❤️</div>


    <!-- HERO CONTENT -->

    <div
        class="hero-content"
        data-aos="zoom-in"
        data-aos-duration="1200">


        <p class="small-title">

            ✨ A Message From Deepu ✨

        </p>


        <h1>

            Until We Meet Again...

        </h1>


        <div class="decorative-line"></div>


        <h3 class="friend-name">

            Divyuuuu ❤️

        </h3>


        <p class="hero-text">

            Even though we talk every day...

            <br>

            I still miss seeing you.

            <br>

            So I made something special...

            <br>

            Just for you. 💗

        </p>


        <button
            onclick="goToPage('letter.html')"
            id="startJourney">

            <i class="fa-solid fa-heart"></i>

            &nbsp;

            Open My Heart

            &nbsp;

            <i class="fa-solid fa-arrow-right"></i>

        </button>


    </div>


</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>


<script>

AOS.init({

    duration: 1000,

    once: true

});


function goToPage(page) {

    if (

        window.parent &&

        window.parent !== window &&

        typeof window.parent.loadPage === "function"

    ) {

        window.parent.loadPage(page);

    }

    else {

        window.location.href = page;

    }

}

</script>


<script src="js/script.js"></script>


</body>

</html>
